<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>개찰알림</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="개찰알림">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#d6e9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16283a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v1.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v1.png">
<link rel="manifest" href="manifest.webmanifest?v=1">
<style>
/* ═══ app-kit.css — 모바일 웹앱 공통 (화면 채우기 · 로딩 · 스와이프 · 시트) ═══
   색은 :root 의 토큰만 바꿔서 앱마다 맞춘다. --solid 는 탭바/하단 띠 색이며 html 배경과 같아야 한다. */
:root{
  --bg:#f3f5f8; --solid:#ffffff; --ink:#12151c; --muted:#6b7280; --line:rgba(18,21,28,.10);
  --accent:#3b6cf6; --danger:#e5484d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10141b; --solid:#171c25; --ink:#f2f4f8; --muted:#9aa3b2; --line:rgba(255,255,255,.12); color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── 1. 화면 채우기 (위아래 공백 제거) ──
   · html 배경 = 하단 띠 색(--solid): 아이폰이 그리지 않는 맨 아래 칸이 탭바와 이어져 보인다.
   · 문서는 스크롤하지 않고(#sc 만 스크롤) 탭바는 fixed 가 아닌 flex 맨 아래 칸에 둔다.
   · --app-h 는 app-kit.js 의 fixViewport() 가 실제 화면 높이로 넣어 준다. */
html{height:100%;background:var(--solid);overflow:hidden}
body{margin:0;height:var(--app-h,100%);overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ak-top{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg);
  padding:calc(8px + var(--sat)) max(16px,var(--sar)) 8px max(16px,var(--sal))}
.ak-top h1{flex:1;margin:0;font-size:20px;font-weight:800}
#sc{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:4px max(16px,var(--sar)) 20px max(16px,var(--sal))}
.ak-tabs{flex:none;display:flex;background:var(--solid);border-top:1px solid var(--line);
  padding:6px max(8px,var(--sar)) max(6px,calc(var(--sab) - 14px)) max(8px,var(--sal))}
.ak-tabs button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);
  padding:6px 0;display:grid;gap:2px;justify-items:center;cursor:pointer}
.ak-tabs button .i{font-size:20px;line-height:1}
.ak-tabs button.on{color:var(--accent)}
/* 아이폰은 16px 보다 작은 입력칸을 누르면 화면을 확대한다 */
input,select,textarea{font-size:16px}
button{touch-action:manipulation}

/* ── 2. 로딩 ── */
/* 2-1 첫 화면: JS 가 뜨기 전부터 보이는 아이콘 + 문구 */
.ak-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);text-align:center;transition:opacity .25s}
.ak-boot.out{opacity:0;pointer-events:none}
.ak-boot img{width:84px;height:84px;border-radius:20px;animation:ak-breathe 1.6s ease-in-out infinite}
.ak-boot p{margin:14px 0 0;color:var(--muted);font-size:14px}
@keyframes ak-breathe{50%{transform:scale(.94);opacity:.75}}
/* 2-2 누른 동작 처리 중: 위쪽 진행 막대 + 알약 + 누른 버튼 스피너 */
.ak-bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s;overflow:hidden;
  background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ak-bar.on{opacity:1}
.ak-bar::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:3px;background:var(--accent);animation:ak-bar 1.1s ease-in-out infinite}
@keyframes ak-bar{to{left:100%}}
.ak-pill,.ak-toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:61;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 24px rgba(0,0,0,.22)}
.ak-pill{display:flex;align-items:center;gap:8px}
.ak-pill.on,.ak-toast.on{opacity:1;transform:translate(-50%,0)}
.ak-pill.top{top:calc(14px + var(--sat));bottom:auto}
.ak-pill .e{display:inline-block;animation:ak-hop .5s ease-in-out infinite alternate}
@keyframes ak-hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-4px) rotate(6deg)}}
.ak-pill .d i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:currentColor;animation:ak-dot 1.2s infinite}
.ak-pill .d i:nth-child(2){animation-delay:.2s}.ak-pill .d i:nth-child(3){animation-delay:.4s}
@keyframes ak-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.is-busy{position:relative;pointer-events:none;opacity:.6}
.is-busy::after{content:"";position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;
  border:2px solid currentColor;border-right-color:transparent;animation:ak-spin .7s linear infinite}
/* 2-3 배경 새로고침: 새로고침 아이콘만 돈다 */
.ak-icon-btn{border:0;background:none;color:inherit;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;padding:0}
.ak-icon-btn svg{display:block;transform-origin:50% 50%;will-change:transform}
.ak-spin{animation:ak-spin .8s linear infinite}
@keyframes ak-spin{to{transform:rotate(360deg)}}

/* ── 3. 스와이프 ── */
.ak-in-l{animation:ak-in-l .22s ease-out}.ak-in-r{animation:ak-in-r .22s ease-out}
@keyframes ak-in-l{from{transform:translateX(28px);opacity:0}}
@keyframes ak-in-r{from{transform:translateX(-28px);opacity:0}}
.ak-hscroll{overflow-x:auto;scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}
.ak-hscroll::-webkit-scrollbar{display:none}

/* ── 4. 바텀시트 (끌어서 열고 닫기) ── */
.ak-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.ak-scrim.on{opacity:1;pointer-events:auto}
.ak-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--solid);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:0 max(18px,var(--sar)) calc(18px + var(--sab)) max(18px,var(--sal))}
.ak-sheet.on{transform:translateY(0)}
.ak-sheet.dragging{transition:none}
/* 시트 아래로 같은 색을 이어 붙여 아이폰 하단 틈을 가린다 */
.ak-sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 1px);height:200px;background:var(--solid)}
.ak-grab{flex:none;padding:8px 0 12px;touch-action:none;cursor:grab}
.ak-grab::before{content:"";display:block;width:40px;height:5px;border-radius:9px;margin:0 auto;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.ak-sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

@media (prefers-reduced-motion:reduce){
  .ak-bar::before,.ak-pill .e,.ak-pill .d i,.is-busy::after,.ak-spin,.ak-boot img{animation-duration:2.5s}
  .ak-in-l,.ak-in-r{animation:none}.ak-sheet,.ak-scrim{transition:none}
}

/* ── 5. 상태·오류·예시 표시 ── */
/* 숫자는 자릿수가 흔들리지 않게 */
.num{font-variant-numeric:tabular-nums}
/* 갱신 상태: <span class="ak-status"><i class="ak-dot live"></i>14:32 갱신</span> */
.ak-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ak-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ak-dot.live{background:#22c55e;animation:ak-pulse 1.8s infinite}
.ak-dot.off{background:var(--danger)}
@keyframes ak-pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* 예시 데이터로 보는 중 */
.ak-demo{flex:none;background:var(--ink);color:var(--bg);text-align:center;font-size:12.5px;padding:calc(6px + var(--sat)) 6px 6px}
.ak-demo:not([hidden]) + .ak-top{padding-top:8px}
/* 앱 오류 */
.ak-err{flex:none;background:var(--danger);color:#fff;font-size:12.5px;line-height:1.4;padding:calc(6px + var(--sat)) 12px 6px;overflow-wrap:anywhere}
/* 빈 화면·불러오기 실패 */
.ak-empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:36px 16px}
/* 설명 글은 가운데 정렬 + 낱말 중간에서 끊지 않기(한글 기본값은 글자 단위로 끊긴다) + 줄 길이 고르게.
   칸보다 긴 낱말(주소·코드)만 그 안에서 끊는다. 손으로 <br>을 넣어 맞추지 않는다 */
.ak-center,.note,.ak-empty,.ak-demo{word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.ak-center,.note{text-align:center}
.ak-empty button{margin-top:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-weight:600;border-radius:10px;padding:8px 16px}
/* 선 아이콘: <svg class="ak-ic" viewBox="0 0 24 24"><path …/></svg> — 글자색을 따라간다 */
.ak-ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.ak-dot.live{animation:none}}
/* ── 이 앱의 색: 파스텔 하늘 (올포오션과 같은 계열) ── */
:root{ --bg:#f3f8fc; --solid:#ffffff; --accent:#4f93c9; --on-accent:#fff; --top-bg:#d6e9f7; --top-ink:#1f4d70; --chip:#e9f2fa; --title:#2b6ca3;
  --box:#f4f7fa;
  --p-go:#dff3e6; --p-go-ink:#1d6b3c; --p-warn:#fdf0d5; --p-warn-ink:#8a5a00; --p-stop:#fde2e2; --p-stop-ink:#a12b2b;
  --p-blue:#e1eefb; --p-blue-ink:#235a8c; --p-violet:#ece6fb; --p-violet-ink:#5b3fa6; --mine:#fff4c2; --mine-ink:#6b4e00; }
@media (prefers-color-scheme:dark){ :root{ --bg:#0f1720; --solid:#152030; --accent:#8fc1ea; --on-accent:#0d2436; --top-bg:#16283a; --top-ink:#cfe5f7;
  --chip:#1c2d40; --title:#9ccbf0; --box:#1a2636;
  --p-go:#173528; --p-go-ink:#8fe0ae; --p-warn:#3a2e14; --p-warn-ink:#f5cf7a; --p-stop:#3d1d1f; --p-stop-ink:#ffb1b1;
  --p-blue:#18304a; --p-blue-ink:#a9d0f5; --p-violet:#2a2345; --p-violet-ink:#c9b8ff; --mine:#3b3412; --mine-ink:#ffe48a; } }
.ak-top{background:var(--top-bg);color:var(--top-ink)}
.ak-top .ak-status{color:var(--top-ink);opacity:.85}
.ak-tabs button{position:relative}
.badge{position:absolute;top:-4px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:10.5px;font-weight:800;line-height:17px;font-style:normal}
#sc{padding-top:12px}
body.kb #sc{padding-bottom:50vh}
.sec{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:14px;font-weight:800}
.sec:first-child{margin-top:2px}
.sec::before{content:"";width:4px;height:15px;border-radius:2px;background:var(--accent)}
.sec .n{color:var(--muted);font-weight:600;font-size:12.5px}
.sec .r{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--muted)}

/* 꼬리표 */
.tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--chip);color:var(--top-ink)}
.t-go{background:var(--p-go);color:var(--p-go-ink)}.t-warn{background:var(--p-warn);color:var(--p-warn-ink)}
.t-stop{background:var(--p-stop);color:var(--p-stop-ink)}.t-violet{background:var(--p-violet);color:var(--p-violet-ink)}
.t-blue{background:var(--p-blue);color:var(--p-blue-ink)}.t-new{background:#e5484d;color:#fff}
.t-dash{background:none;border:1px dashed var(--line);color:var(--muted)}

/* 카드 (A안 기본) */
.bcl{display:grid;gap:10px}
.bc{background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer}
.bc .tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-bottom:7px}
.bc .tags .tm{margin-left:auto;font-size:11.5px;color:var(--muted)}
.bc h3{margin:0;font-size:15.5px;line-height:1.38;color:var(--title);font-weight:700;word-break:keep-all;overflow-wrap:break-word}
.bc .org{margin-top:4px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.grid3>div{background:var(--box);border-radius:10px;padding:7px 8px;min-width:0}
.grid3 small{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px}
.grid3 b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13.5px;line-height:1.3;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.grid3 .mine{background:var(--mine);color:var(--mine-ink)}
.grid3 .mine small{color:inherit;opacity:.8}

/* 검색 */
.sbox{display:flex;gap:8px}
.sbox input{flex:1;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.btn{border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;padding:0 16px;height:46px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--solid);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%;margin-top:10px}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-size:13px;font-weight:600;border-radius:999px;height:32px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .x{opacity:.6;font-weight:800}
.star{flex:none;border:1px solid var(--line);background:var(--solid);color:var(--muted);border-radius:10px;height:34px;padding:0 10px;font:inherit;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.star.on{background:var(--mine);border-color:transparent;color:var(--mine-ink)}
.star svg{width:15px;height:15px}
.kwbar{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:14px;padding:10px 12px;margin:12px 0 4px;font-size:13px;color:var(--top-ink)}
.kwbar span{flex:1;word-break:keep-all}
.bc .row{display:flex;align-items:flex-start;gap:10px}
.bc .row>div{flex:1;min-width:0}

/* 설정 */
.card{background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:15px}
.card .sub{margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.5;word-break:keep-all}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--box);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;height:38px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--solid);color:var(--title);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .lb{flex:1;min-width:0;font-size:14px;font-weight:600}
.line .lb small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px;word-break:keep-all;text-wrap:balance}
.line input[type=text],.line input[type=email],.line select,.fld{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--box);color:var(--ink);padding:0 10px;font:inherit;font-size:16px;min-width:0}
.fld{width:100%;margin-top:6px}
.sw{position:relative;flex:none;width:50px;height:30px}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:15px;background:color-mix(in srgb,var(--ink) 18%,transparent);transition:.2s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(20px)}
.ok{color:var(--p-go-ink)}.bad{color:var(--p-stop-ink)}
.diag{color:var(--muted);font-size:11px;line-height:1.5;margin-top:16px;text-align:center;word-break:keep-all}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:10px 4px}

/* 공고 정보 표 (나라장터 '공고일반'처럼 이름 | 값) */
.kv{margin:14px 0 0}
.kv h4{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-size:13.5px;font-weight:800}
.kv h4::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--accent)}
.kv dl{display:grid;grid-template-columns:9.6em 1fr;margin:0;border-top:2px solid var(--accent);font-size:13px}
.kv dt,.kv dd{margin:0;padding:8px 10px;border-bottom:1px solid var(--line);word-break:keep-all;overflow-wrap:anywhere;line-height:1.45}
.kv dt{background:var(--box);color:var(--muted);font-weight:600;white-space:nowrap;overflow-wrap:normal}
.kv dd{font-weight:600}
.t-urgent{background:var(--p-stop);color:var(--p-stop-ink)}
/* 상세 시트 */
.dt h2{margin:6px 0 4px;font-size:17px;line-height:1.38;color:var(--title);word-break:keep-all}
.dt .org{font-size:13px;color:var(--muted)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin:12px 0;background:var(--box);border-radius:12px;padding:12px}
.facts dt{color:var(--muted)}.facts dd{margin:0;font-weight:600;text-align:right}
table.bd{width:100%;border-collapse:collapse;font-size:13px}
table.bd th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}

<body>
<div class="ak-boot"><div><img src="icon-180-v1.png" alt=""><p>불러오는 중…</p></div></div>

<header class="ak-top">
  <h1 id="ttl">개찰알림</h1>
  <span class="ak-status"><i class="ak-dot" id="dot"></i><span id="st">불러오는 중…</span></span>
  <button class="ak-icon-btn" id="refresh" type="button" aria-label="새로고침"><svg class="ak-ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
</header>
<main id="sc"></main>
<nav class="ak-tabs" aria-label="메뉴">
  <button type="button" data-tab="feed"><span class="i"><svg class="ak-ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><b class="badge" id="badge" hidden></b></span>알림</button>
  <button type="button" data-tab="search"><span class="i"><svg class="ak-ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></span>검색</button>
  <button type="button" data-tab="watch"><span class="i"><svg class="ak-ic" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></span>감시</button>
  <button type="button" data-tab="set"><span class="i"><svg class="ak-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>설정</button>
</nav>

<div class="ak-sheet" id="sheet"><div class="ak-grab"></div><div class="body" id="sheetBody"></div></div>

<script>
/* ═══ app-kit.js — 모바일 웹앱 공통 동작 ═══
   AppKit.fixViewport()            화면 높이 보정 (아이폰 홈 화면 앱 위아래 공백 제거)
   AppKit.bootDone()               첫 로딩 화면 걷기
   AppKit.track(promise, opts)     진행 막대 + 알약 + 누른 버튼 스피너
   AppKit.wrap(fn, skip)           API 함수를 감싸 "방금 누른 동작"만 자동으로 진행 표시
   AppKit.spin(el, promise)        새로고침 아이콘 돌리기 (배경 새로고침용)
   AppKit.toast(msg)               짧은 알림
   AppKit.swipe(el, {onNext,onPrev})  좌우 스와이프 (탭·날짜 넘기기)
   AppKit.tabs({...})              탭바 + 스와이프 + 넘김 애니메이션
   AppKit.sheet(el)                바텀시트 열기/닫기 + 끌어내려 닫기
   AppKit.autoUpdate(build)        version.txt 가 바뀌면 새 버전으로 다시 열기
   AppKit.env()                    진단 문구 (버전·홈 화면 앱 여부·화면 크기)
   AppKit.store('앱접두어')         localStorage 를 안전하게 (get/set/del)
   AppKit.esc / num / krw / signed / kstDate / addDays / hhmm   글자·숫자·날짜
   AppKit.poll(fn, ms, busy)       화면이 보일 때만 자동 새로고침 + 돌아오면 즉시
   AppKit.editing(view)            입력 중인지 (배경 새로고침이 입력값을 지우지 않게)
   AppKit.sequence()               늦게 온 예전 응답 버리기
   AppKit.showErrors(build)        앱 오류를 화면에 표시
   AppKit.sure(btn)                두 번 눌러야 지워지는 버튼
   AppKit.copy(text) / buzz()      복사 · 진동
   AppKit.toJpeg(file, maxSide)    사진 줄여서 올리기
   AppKit.device()                 접속 기록용 기기·방식 */
const AppKit = (() => {
  const $ = s => typeof s === 'string' ? document.querySelector(s) : s;
  const root = document.documentElement;
  const standalone = () => !!navigator.standalone || matchMedia('(display-mode: standalone)').matches;

  /* ── 1. 화면 높이 ──
     아이폰 홈 화면 앱은 웹 화면(innerHeight)을 실제 화면보다 짧게 잡을 때가 있다.
     그 차이(gap)만큼 문서 높이를 늘려 맨 아래 빈 띠를 없앤다. 가로 모드·브라우저에서는 보정하지 않는다. */
  let gap = 0;
  function fixViewport() {
    const set = () => {
      const portraitH = Math.max(screen.height, screen.width);
      const raw = innerHeight < innerWidth ? 0 : portraitH - innerHeight;
      // 개찰알림: 사용자 아이폰(홈 화면 앱, 상태바 default)에서 raw 가 상태바 높이만큼 잡혀 탭바가 화면 밖으로 밀렸다.
      // 보정을 끄고 실제 보이는 높이(innerHeight)만 쓴다. 혹시 아래에 띠가 남아도 html 배경이 탭바 색이라 이어져 보인다.
      gap = 0; void raw;
      root.style.setProperty('--app-h', (innerHeight + gap) + 'px');
      root.classList.toggle('standalone', standalone());
    };
    set();
    addEventListener('resize', set);
    addEventListener('orientationchange', () => setTimeout(set, 300));
  }

  /* ── 2. 로딩 ── */
  function bootDone() { const b = $('.ak-boot'); if (!b) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); }

  let tapAt = 0, tapEl = null, busyN = 0, pillTm = 0, busyLabel = '잠깐만요, 처리 중이에요', busyEmoji = '⏳';
  ['pointerdown', 'change'].forEach(t => document.addEventListener(t, e => {
    tapAt = Date.now();
    if (t === 'pointerdown') tapEl = e.target.closest?.('button,label,.btn,[role=button]') || null;
  }, true));
  function busyUI(on, label) {
    let bar = $('.ak-bar'), pill = $('.ak-pill');
    if (on) {
      if (!bar) { bar = document.createElement('div'); bar.className = 'ak-bar'; document.body.appendChild(bar); }
      if (!pill) { pill = document.createElement('div'); pill.className = 'ak-pill'; pill.setAttribute('role', 'status'); document.body.appendChild(pill); }
      pill.innerHTML = `<span class="e">${busyEmoji}</span><span></span><span class="d"><i></i><i></i><i></i></span>`;
      pill.children[1].textContent = label || busyLabel;
      pill.classList.toggle('top', !!$('.ak-sheet.on'));           // 시트가 열려 있으면 버튼을 가리지 않게 위로
      requestAnimationFrame(() => bar.classList.add('on'));
      clearTimeout(pillTm); pillTm = setTimeout(() => pill.classList.add('on'), 350);   // 금방 끝나면 알약은 안 띄움
    } else {
      clearTimeout(pillTm); bar?.classList.remove('on'); pill?.classList.remove('on');
      document.querySelectorAll('.is-busy').forEach(x => x.classList.remove('is-busy'));
    }
  }
  function track(p, { el, label } = {}) {
    busyN++; const b = $(el) || tapEl; if (b && document.contains(b)) b.classList.add('is-busy'); busyUI(true, label);
    const done = () => { if (--busyN <= 0) { busyN = 0; busyUI(false); } };
    p.then(done, done); return p;
  }
  /* 사용자가 누른 지 1.5초 안에 시작된 요청만 표시한다. 배경 새로고침은 조용히. */
  function wrap(fn, skip) {
    return function (...a) {
      const p = fn.apply(this, a);
      if (Date.now() - tapAt > 1500 || (skip && skip(...a))) return p;
      return track(p);
    };
  }
  /* 아이콘만 돌린다(버튼째 돌리면 축이 어긋나 꿀렁거렸다). 응답이 오면 돌던 바퀴를 마저 돌고 0도에서 멈춘다(중간에 멈추면 툭 튀었다) */
  function spin(el, p) {
    el = $(el); if (!el) return p;
    const ic = el.querySelector('svg') || el;
    ic.dataset.spinN = (+ic.dataset.spinN || 0) + 1;
    ic.classList.add('ak-spin');
    const off = () => {
      if (--ic.dataset.spinN > 0) return;
      const stop = () => { if (+ic.dataset.spinN <= 0) ic.classList.remove('ak-spin'); };
      ic.addEventListener('animationiteration', stop, { once: true });
      setTimeout(stop, 2600);
    };
    p.then(off, off); return p;
  }
  function setBusy({ label, emoji } = {}) { if (label) busyLabel = label; if (emoji) busyEmoji = emoji; }

  let toastTm = 0;
  function toast(msg, ms = 2400) {
    let t = $('.ak-toast');
    if (!t) { t = document.createElement('div'); t.className = 'ak-toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
    t.textContent = msg; requestAnimationFrame(() => t.classList.add('on'));
    clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('on'), ms);
  }

  /* ── 3. 스와이프 ──
     · 세로 스크롤과 헷갈리지 않게: 가로 이동이 세로의 1.5배 이상, 60px 이상, 0.7초 이내일 때만.
     · 가로로 스크롤되는 영역·입력칸·지도·[data-noswipe] 안에서 시작하면 무시.
     · 화면 왼쪽 끝 24px 에서 시작하면 무시 (사파리 뒤로 가기 동작과 겹침). */
  function hScrollable(n, stop) {
    for (; n && n !== stop && n.nodeType === 1; n = n.parentElement) {
      if (n.matches('[data-noswipe],input,textarea,select,.ak-hscroll,.leaflet-container,canvas')) return true;
      if (n.scrollWidth > n.clientWidth + 4 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) return true;
    }
    return false;
  }
  function swipe(el, { onNext, onPrev, min = 60 } = {}) {
    el = $(el); let x0 = null, y0 = 0, t0 = 0;
    el.addEventListener('touchstart', e => {
      x0 = null; if (e.touches.length !== 1) return;
      const t = e.touches[0]; if (t.clientX < 24 || hScrollable(e.target, el)) return;
      x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) < min || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0 > 700) return;
      (dx < 0 ? onNext : onPrev)?.();
    }, { passive: true });
    el.addEventListener('touchcancel', () => { x0 = null; }, { passive: true });
  }
  /* 탭바(.ak-tabs button[data-tab]) + 내용(render) + 스와이프를 한 번에 연결 */
  function tabs({ bar = '.ak-tabs', view = '#sc', ids, start, render, remember = 'ak-tab' }) {
    bar = $(bar); view = $(view);
    let cur = start || ids[0];
    try { const s = localStorage.getItem(remember); if (remember && ids.includes(s)) cur = s; } catch (e) {}
    function go(id, dir) {
      if (!ids.includes(id)) return;
      if (dir == null) dir = Math.sign(ids.indexOf(id) - ids.indexOf(cur));
      cur = id; try { remember && localStorage.setItem(remember, id); } catch (e) {}
      bar?.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
      render(id); view.scrollTop = 0;
      view.classList.remove('ak-in-l', 'ak-in-r');
      if (dir) { void view.offsetWidth; view.classList.add(dir > 0 ? 'ak-in-l' : 'ak-in-r'); }
    }
    bar?.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
    swipe(view, {
      onNext: () => { const i = ids.indexOf(cur); if (i < ids.length - 1) go(ids[i + 1], 1); },
      onPrev: () => { const i = ids.indexOf(cur); if (i > 0) go(ids[i - 1], -1); },
    });
    go(cur, 0);
    return { go, get current() { return cur; } };
  }

  /* ── 4. 바텀시트 ── 손잡이(.ak-grab)를 끌어내리거나 바깥을 누르면 닫힌다 */
  function sheet(el) {
    el = $(el);
    let scrim = el.previousElementSibling?.classList.contains('ak-scrim') ? el.previousElementSibling : null;
    if (!scrim) { scrim = document.createElement('div'); scrim.className = 'ak-scrim'; el.before(scrim); }
    const open = () => { el.style.transform = ''; el.classList.add('on'); scrim.classList.add('on'); };
    const close = () => { el.style.transform = ''; el.classList.remove('on'); scrim.classList.remove('on'); };
    scrim.addEventListener('click', close);
    const g = el.querySelector('.ak-grab');
    if (g) {
      let y0 = null, moved = 0, t0 = 0;
      g.addEventListener('pointerdown', e => { y0 = e.clientY; t0 = Date.now(); moved = 0; el.classList.add('dragging'); g.setPointerCapture(e.pointerId); });
      g.addEventListener('pointermove', e => { if (y0 == null) return; moved = Math.max(0, e.clientY - y0); el.style.transform = `translateY(${moved}px)`; });
      const up = () => {
        if (y0 == null) return; y0 = null; el.classList.remove('dragging');
        const v = moved / Math.max(1, Date.now() - t0);
        if (moved > el.offsetHeight * .3 || v > .5) close(); else el.style.transform = '';
      };
      g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
    }
    return { open, close, get isOpen() { return el.classList.contains('on'); } };
  }

  /* ── 5. 새 버전 자동 열기 ──
     휴대폰이 예전 화면을 붙잡고 있을 때: version.txt 숫자가 이 페이지의 build 와 다르면 ?v=숫자 로 다시 연다.
     같은 버전으로 두 번 되돌지 않게 sessionStorage 에 기록한다. */
  function autoUpdate(build, url = 'version.txt') {
    const chk = () => fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text()).then(v => {
      v = (v || '').trim(); if (!/^[0-9]+$/.test(v) || v === String(build)) return;
      try { if (sessionStorage.getItem('ak-up') === v) return; sessionStorage.setItem('ak-up', v); } catch (e) {}
      location.replace(location.pathname + '?v=' + v + location.hash);
    }).catch(() => {});
    chk(); document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); });
  }

  /* ── 6. 진단 ── 화면 문제를 볼 때 설정 화면 맨 아래에 작게 보여 준다 */
  function env(build) {
    const p = document.createElement('div');
    p.style.cssText = 'position:fixed;top:env(safe-area-inset-top);height:env(safe-area-inset-bottom);visibility:hidden';
    document.body.appendChild(p); const cs = getComputedStyle(p), st = cs.top, sb = cs.height; p.remove();
    return `버전 ${build ?? '-'} · ${standalone() ? '홈 화면 앱' : '브라우저'} · 화면 ${screen.width}×${screen.height} · 웹뷰 ${innerWidth}×${innerHeight} · 안전영역 위 ${st} 아래 ${sb} · 보정 ${gap}px`;
  }

  /* ── 7. 저장·글자·숫자 ── */
  /* 저장소: 앱마다 접두어를 붙이고(같은 github.io 주소를 여러 앱이 함께 쓴다), 막혀 있어도 앱이 죽지 않게 try 로 감싼다 */
  function store(prefix) {
    const k = n => prefix + '.' + n;
    return {
      get(n, d) { try { const v = localStorage.getItem(k(n)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
      set(n, v) { try { localStorage.setItem(k(n), JSON.stringify(v)); } catch (e) {} },
      del(n) { try { localStorage.removeItem(k(n)); } catch (e) {} },
    };
  }
  /* 서버·사용자 글자를 innerHTML 에 넣을 때는 반드시 esc() */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const num = n => Math.round(n).toLocaleString('ko-KR');
  const krw = n => (n < 0 ? '−' : '') + num(Math.abs(n)) + '원';
  const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + num(Math.abs(n));
  /* 날짜는 휴대폰 시간대와 상관없이 한국 시간 기준 YYYY-MM-DD */
  const kstDate = (d = new Date()) => new Date(d.getTime() + 9 * 3600e3).toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const hhmm = (d = new Date()) => pad(d.getHours()) + ':' + pad(d.getMinutes());

  /* ── 8. 자동 새로고침 ──
     화면이 보일 때만 ms 마다 fn 을 부르고, 다른 앱에 갔다 돌아오면 바로 한 번 부른다.
     ms 를 함수로 주면 매번 간격을 다시 정한다(예: 장중 15초, 마감 뒤 2분). busy() 가 참이면 건너뛴다. */
  function poll(fn, ms, busy) {
    let tm = 0;
    const next = () => { clearTimeout(tm); if (!document.hidden) tm = setTimeout(tick, typeof ms === 'function' ? ms() : ms); };
    const tick = async () => { if (!document.hidden && !(busy && busy())) { try { await fn(); } catch (e) {} } next(); };
    document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(tm); else tick(); });
    next();
    return { now: tick, stop: () => clearTimeout(tm) };
  }
  /* 사용자가 입력 중이거나 저장 안 한 값이 있으면 참 → 배경 새로고침이 화면을 다시 그려 입력값을 지우지 않게 */
  function editing(view = '#sc') {
    const v = $(view); if (!v) return false; const a = document.activeElement;
    if (a && v.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
    return [...v.querySelectorAll('input,textarea')].some(i =>
      i.type === 'checkbox' || i.type === 'radio' ? i.checked !== i.defaultChecked : i.type !== 'file' && i.value !== i.defaultValue);
  }
  /* 늦게 온 예전 응답 버리기:  const mine = seq.next();  …await…  if (!seq.is(mine)) return; */
  function sequence() { let n = 0; return { next: () => ++n, is: v => v === n }; }

  /* ── 9. 오류·확인 ── */
  /* 앱 오류를 화면에 보여 준다(사용자가 캡처해서 알려 줄 수 있게). 다른 주소 스크립트의 'Script error.'(줄 번호 없음)는 무시 */
  function showErrors(build) {
    addEventListener('error', e => {
      if (!e.lineno) return;
      let b = $('.ak-err'); if (!b) { b = document.createElement('div'); b.className = 'ak-err'; document.body.prepend(b); }
      b.textContent = `앱 오류: ${e.message || '알 수 없음'} (줄 ${e.lineno}${build ? ' · 버전 ' + build : ''})`;
    });
  }

function renderFeed() {

/* ───────── 검색 탭 ───────── */
const KINDS = [['Servc', '용역'], ['Thng', '물품'], ['Cnstwk', '공사']];
function noticeCard(n) {

    <div class="grid3"><div><small>추정가격</small><b class="num">${won(n.price)}</b></div><div><small>입찰마감</small><b class="num">${mdhm(n.closeDt)}</b></div><div><small>개찰</small><b class="num">${mdhm(n.opengDt)}</b></div></div></div>`;

function renderSearch() {
  const q = S.q, set = S.d?.settings || {};

  let list = '';

  else if (S.found?.error) list = `<div class="ak-empty">${esc(S.found.error)}<br><button data-act="search" type="button">다시 시도</button></div>`;
  else if (S.found) list = `<div class="sec">입찰공고 <span class="n">${S.found.items.length}건</span><span class="r">최근 ${q.days}일 공고</span></div>`
    + (S.found.items.length ? '<div class="bcl">' + S.found.items.map(noticeCard).join('') + '</div>'
      : '<div class="ak-empty">찾은 공고가 없어요. 낱말을 줄이거나 기간을 늘려 보세요.</div>');
  else list = `<p class="note">사업명이나 기관 이름으로 나라장터 입찰공고를 찾아요.<br>별표를 누르면 그 사업의 개찰결과가 올라오는 즉시 알려 드려요.</p>`;
  return `<form class="sbox" id="sform"><input id="qtext" type="search" enterkeyhint="search" placeholder="예: 해양 GIS, 국립해양조사원" value="${esc(q.text)}" autocomplete="off"><button class="btn" type="submit">검색</button></form>
    <div class="chips">${[7, 30, 90].map(n => `<button class="chip ${q.days === n ? 'on' : ''}" data-days="${n}" type="button">${n}일</button>`).join('')}
      <span style="width:6px"></span>${KINDS.map(([k, l]) => `<button class="chip ${q.kinds.includes(k) ? 'on' : ''}" data-kind="${k}" type="button">${l}</button>`).join('')}</div>
    ${q.text && S.found && !S.found.error && S.found !== 'busy' ? `<div class="kwbar"><span>‘${esc(q.text)}’ 이(가) 들어간 <b>모든 사업</b>의 개찰결과도 받을까요?</span><button class="btn sm ${kwOn ? 'ghost' : ''}" data-kwadd="${esc(q.text)}" type="button">${kwOn ? '받는 중' : '키워드로 받기'}</button></div>` : ''}

async function doSearch() {
  const el = document.getElementById('qtext'); if (el) S.q.text = el.value.trim();
  LS.set('q', S.q); S.found = 'busy'; tabs.go('search', 0);
  try { S.found = await api('search', { text: S.q.text, days: S.q.days, kinds: S.q.kinds }); }
  catch (e) { S.found = { error: e.message || '찾지 못했어요' }; }
  if (tabs.current === 'search') tabs.go('search', 0);
}

/* ───────── 상세 시트 ───────── */
const sheet = AppKit.sheet('#sheet');
const NOTICE = {};   // 공고번호 → { info, url, urgent } (한 번 받은 것은 다시 묻지 않는다)
function infoHtml(info) {
  return (info || []).map(sec => `<div class="kv"><h4>${esc(sec.title)}</h4><dl>${sec.rows.map(([k, v]) =>
    `<dt>${esc(k)}</dt><dd>${k === '공고명' ? nm(v) : esc(v)}</dd>`).join('')}</dl></div>`).join('');
}
const g2bLink = (url, no) => `<a class="btn wide ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:14px" href="${esc(url || 'https://www.g2b.go.kr')}" target="_blank" rel="noopener">${url ? '나라장터 공고 원문 보기' : '나라장터에서 보기 (공고번호 ' + esc(no) + ')'}</a>`;
async function noticeOf(no, kind) {
  const w = (S.d?.watches || []).find(x => x.no === no && (x.info || []).length) || (S.found?.items || []).find(x => x.no === no && (x.info || []).length);
  if (w) return { info: w.info, url: w.url, urgent: w.urgent };
  if (!NOTICE[no]) NOTICE[no] = await api('notice', { no, kind });
  return NOTICE[no];
}
async function openNotice(no) {
  const n = (S.found?.items || []).find(x => x.no === no) || (S.d?.watches || []).find(x => x.no === no); if (!n) return;
  const box = document.getElementById('sheetBody');
  const draw = (d, loading) => {
    const on = isWatched(no), dd = dday(n.opengDt);
    box.innerHTML = `<div class="dt"><div class="tags" style="display:flex;gap:5px;flex-wrap:wrap"><span class="tag t-blue">${({ Servc: '용역', Thng: '물품', Cnstwk: '공사' })[n.kind] || '입찰'}</span>${(d && d.urgent) || n.urgent ? '<span class="tag t-urgent">긴급공고</span>' : ''}${n.status ? '<span class="tag ' + statusCls(n.status) + '">' + esc(n.status) + '</span>' : ''}${dd ? '<span class="tag t-violet">개찰 ' + dd + '</span>' : ''}</div>
      <h2>${nm(n.name)}</h2><div class="org">${esc(n.org)}${n.demand && n.demand !== n.org ? ' · ' + esc(n.demand) : ''}</div>
      ${loading ? '<div class="ak-empty">공고 정보를 불러오는 중…</div>' : d && d.info.length ? infoHtml(d.info)
        : `<dl class="facts"><dt>공고번호</dt><dd>${esc(n.no)}-${esc(n.ord || '000')}</dd><dt>입찰마감</dt><dd>${esc(n.closeDt || '-')}</dd><dt>개찰일시</dt><dd>${esc(n.opengDt || '-')}</dd><dt>추정가격</dt><dd>${wonFull(n.price)}</dd></dl>`}
      <button class="btn wide ${on ? 'ghost' : ''}" style="margin-top:14px" data-star="${esc(no)}" type="button">${on ? '감시 해제' : '★ 감시에 넣기 — 개찰결과가 나오면 알림'}</button>
      ${g2bLink(d && d.url, no)}</div>`;
  };
  const has = (n.info || []).length;
  draw(has ? { info: n.info, url: n.url, urgent: n.urgent } : null, !has);
  sheet.open();
  if (!has) {
    let d = null; try { d = await noticeOf(no, n.kind); } catch (e) { d = null; }
    if (sheet.isOpen) draw(d, false);
  }
}
async function openDetail(key) {
  const r = (S.d?.results || []).find(x => x.key === key); if (!r) return;
  const box = document.getElementById('sheetBody');
  const draw = (bd, loading) => {
    box.innerHTML = `<div class="dt"><div class="tags" style="display:flex;gap:5px"><span class="tag ${statusCls(r.status)}">${esc(r.status)}</span><span class="tag">${esc(r.via || '')}</span></div>
      <h2>${nm(r.name)}</h2><div class="org">${esc(r.org)}${r.demand && r.demand !== r.org ? ' · ' + esc(r.demand) : ''}</div>
      <dl class="facts"><dt>공고번호</dt><dd>${esc(r.no)}-${esc(r.ord || '000')}</dd><dt>개찰일시</dt><dd>${esc(r.opengDt)}</dd><dt>참가업체</dt><dd>${r.prtcpt || 0}개</dd>
        ${r.top ? `<dt>1순위</dt><dd>${esc(r.top.name)}</dd><dt>1순위 금액</dt><dd class="num">${wonFull(r.top.amount)} (${rate(r.top.rate)})</dd>` : ''}
        ${r.mine ? `<dt>우리 회사</dt><dd style="color:var(--mine-ink)">${r.mine.rank || '-'}위 · ${rate(r.mine.rate)}</dd>` : ''}</dl>
      ${loading ? '<div class="ak-empty">업체별 순위를 불러오는 중…</div>' : bd.length ? `<table class="bd"><tr><th>순위</th><th>업체</th><th class="r">투찰금액</th><th class="r">투찰률</th></tr>
        ${bd.map(b => `<tr class="${b.mine ? 'mine' : ''}"><td>${b.rank || '-'}</td><td class="nm">${esc(b.name)}${b.rmrk && b.rmrk !== '정상' ? '<br><small style="color:var(--muted)">' + esc(b.rmrk) + '</small>' : ''}</td><td class="r num">${won(b.amount)}</td><td class="r num">${rate(b.rate)}</td></tr>`).join('')}</table>`
        : '<div class="ak-empty">업체별 순위가 아직 없어요</div>'}
      <div id="rNotice">${r.notice ? infoHtml(r.notice.info) : ''}</div>
      ${g2bLink(r.notice && r.notice.url, r.no)}</div>`;
  };
  draw(r.bidders || [], !(r.bidders || []).length && r.status === '개찰완료');
  sheet.open();
  if (!r.read) { r.read = true; api('read', { keys: [key] }).catch(() => {}); setData(S.d, false); }
  if (!(r.bidders || []).length && r.status === '개찰완료') {
    try { r.bidders = await api('detail', { key, no: r.no, ord: r.ord }); } catch (e) { r.bidders = []; }
    if (sheet.isOpen) draw(r.bidders, false);
  }
  // 공고 정보(공고일반 등)는 결과 아래에 붙인다
  if (!r.notice) {
    try { r.notice = await noticeOf(r.no); } catch (e) { r.notice = null; }
    if (sheet.isOpen && r.notice) draw(r.bidders || [], false);
  }
}

/* ───────── 탭·클릭 ───────── */
const tabs = AppKit.tabs({
  ids: ['feed', 'search', 'watch', 'set'], remember: 'g2b-alert.tab', start: hashOpt('tab'),
  render(id) {
    const sc = document.getElementById('sc');
    sc.innerHTML = id === 'feed' ? renderFeed() : id === 'search' ? renderSearch() : id === 'watch' ? renderWatch() : renderSet();
  },
});
if (hashOpt('tab')) tabs.go(hashOpt('tab'), 0);

async function mutate(action, payload, msg) {
  try { const d = await api(action, payload); if (d && d.settings) setData(d); if (msg) AppKit.toast(msg); return d; }
  catch (e) { AppKit.toast(e.message || '처리하지 못했어요'); }
}
document.addEventListener('change', e => {
  const el = e.target.closest('#sc [data-set]');
  if (!el || el.type === 'text') return;
  const v = el.type === 'checkbox' ? el.checked : Number(el.value);
  if (el.dataset.set === 'endHour' || el.dataset.set === 'startHour') {
    const st = Number(document.querySelector('[data-set=startHour]').value), en = Number(document.querySelector('[data-set=endHour]').value);
    if (st >= en) return AppKit.toast('끝나는 시간은 시작보다 늦어야 해요');
  }
  mutate('saveSettings', { settings: { [el.dataset.set]: v } }, '저장했어요');
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'sform') { document.activeElement?.blur(); return doSearch(); }
  const k = e.target.dataset.addto;
  if (k) {
    const v = e.target.querySelector('input').value.trim(); if (!v) return;
    const s = Object.assign({}, S.d.settings); s[k] = [...new Set([...(s[k] || []), v])];
    e.target.querySelector('input').value = '';
    await mutate('saveSettings', { settings: s }, '‘' + v + '’ 추가했어요');
  }
});
document.addEventListener('click', async e => {
  const t = e.target;
  if (t.closest('#refresh')) return refresh();
  const op = t.closest('[data-open]'); if (op) return openDetail(op.dataset.open);
  const st = t.closest('[data-star]');
  if (st) {
    const no = st.dataset.star, inSheet = !!st.closest('#sheet');
    const after = () => { if (!inSheet) return; if ((S.found?.items || []).some(n => n.no === no)) openNotice(no); else sheet.close(); };
    if (isWatched(no)) { if (!AppKit.sure(st, '해제할까요?')) return; await mutate('unwatch', { no }, '감시를 해제했어요'); return after(); }
    const item = (S.found?.items || []).find(n => n.no === no) || (S.d?.watches || []).find(n => n.no === no);
    if (!item) return AppKit.toast('공고 정보를 찾지 못했어요. 다시 검색해 주세요');
    await mutate('watch', { item }, '감시에 넣었어요. 개찰결과가 올라오면 알려 드릴게요'); return after();
  }
  const nt = t.closest('[data-notice]'); if (nt) return openNotice(nt.dataset.notice);
  const dy = t.closest('[data-days]'); if (dy) { S.q.days = +dy.dataset.days; LS.set('q', S.q); return S.q.text || S.found ? doSearch() : tabs.go('search', 0); }
  const kd = t.closest('[data-kind]');
  if (kd) { const k = kd.dataset.kind; S.q.kinds = S.q.kinds.includes(k) ? (S.q.kinds.length > 1 ? S.q.kinds.filter(x => x !== k) : S.q.kinds) : [...S.q.kinds, k]; LS.set('q', S.q); return S.found ? doSearch() : tabs.go('search', 0); }
  const kw = t.closest('[data-kwadd]');
  if (kw) { const s = Object.assign({}, S.d.settings); if ((s.keywords || []).includes(kw.dataset.kwadd)) return; s.keywords = [...(s.keywords || []), kw.dataset.kwadd]; await mutate('saveSettings', { settings: s }, '키워드로 받을게요'); return tabs.go('search', 0); }
  const rm = t.closest('[data-rm]');
  if (rm) { if (!AppKit.sure(rm, '뺄까요?')) return; const s = Object.assign({}, S.d.settings); s[rm.dataset.rm] = (s[rm.dataset.rm] || []).filter(x => x !== rm.dataset.v); return mutate('saveSettings', { settings: s }, '뺐어요'); }
  const iv = t.closest('[data-iv]');
  if (iv) {
    if (+iv.dataset.iv === S.d.settings.interval) return;
    document.querySelectorAll('[data-iv]').forEach(b => b.classList.toggle('on', b === iv));
    return mutate('saveSettings', { settings: { interval: +iv.dataset.iv } }, '이제 ' + iv.textContent + '마다 확인할게요');
  }
  const a = t.closest('[data-act]')?.dataset.act;
  if (a === 'readAll') { S.d.results.forEach(r => r.read = true); setData(S.d); return api('read', { all: true }).catch(() => {}); }
  if (a === 'search') return doSearch();
  if (a === 'save') return mutate('saveSettings', { settings: { myName: document.querySelector('[data-set=myName]').value.trim(), myBizno: document.querySelector('[data-set=myBizno]').value.replace(/\D/g, '') } }, '회사 정보를 저장했어요');
  if (a === 'test') {
    const d = await mutate('test', {}); if (!d) return;
    const t = d.sent || {}, ok = [t.mail && 'Gmail', t.tg && '텔레그램'].filter(Boolean);
    return AppKit.toast(ok.length ? ok.join('·') + '으로 시험 알림을 보냈어요' + (t.tgErr ? ' (텔레그램은 실패: ' + t.tgErr + ')' : '') : '보내지 못했어요: ' + (t.tgErr || '알림 받을 곳이 꺼져 있어요'), 4000);
  }
  if (a === 'checkNow') { const d = await mutate('checkNow', {}); if (d) AppKit.toast('확인했어요 · 새 결과 ' + (d.newCount || 0) + '건'); return; }
  if (a === 'conn') {
    const url = document.getElementById('cUrl').value.trim(), token = document.getElementById('cTok').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)) return AppKit.toast('주소는 https://script.google.com/…/exec 모양이어야 해요');
    S.conn = { url, token }; LS.set('conn', S.conn); LS.del('mode'); S.demo = false;
    await refresh(); return;
  }
});
/* 1분마다, 그리고 앱으로 돌아오면 조용히 새로고침 (시트가 열려 있거나 입력 중이면 건너뜀) */
/* 입력칸을 누르면 키보드에 가리지 않게 아래 여백을 늘리고 그 칸을 화면 가운데로 옮긴다 */
document.addEventListener('focusin', e => {
  if (!e.target.matches('#sc input, #sc select, #sc textarea')) return;
  document.body.classList.add('kb');
  setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
});
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement?.matches('#sc input, #sc select, #sc textarea')) document.body.classList.remove('kb'); }, 200));
AppKit.poll(refresh, 60000, () => sheet.isOpen || AppKit.editing());

if (S.d) { setData(S.d); AppKit.bootDone(); }
refresh().finally(AppKit.bootDone);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
